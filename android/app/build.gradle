plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

final String midasFileName = 'midas_small_256_fp16.tflite'
final String defaultMidasUrl = 'https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite'
def localMidasModel = file("$projectDir/src/main/assets/$midasFileName")
def generatedMidasAssetsDir = file("$buildDir/generated/midasAssets")
def generatedMidasModel = new File(generatedMidasAssetsDir, midasFileName)
def generatedMidasChecksum = new File(generatedMidasAssetsDir, "${midasFileName}.sha256")

def sha256Of = { File model ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    model.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def isValidTflite = { File model ->
    if (!model.isFile() || model.length() <= 60_000_000L) return false
    model.withInputStream { input ->
        byte[] header = new byte[8]
        return input.read(header) == header.length && new String(header, 4, 4, 'US-ASCII') == 'TFL3'
    }
}

tasks.register('prepareMidasModel') {
    description = 'Finds or downloads the MiDaS model, rejecting LFS pointers and corrupt files.'
    group = 'build setup'
    outputs.file(generatedMidasModel)

    doLast {
        generatedMidasAssetsDir.mkdirs()

        if (isValidTflite(localMidasModel)) {
            logger.lifecycle("Using local MiDaS model: ${localMidasModel}")
            localMidasModel.withInputStream { input ->
                generatedMidasModel.withOutputStream { output -> input.transferTo(output) }
            }
        }

        String configuredUrl = providers.gradleProperty('midasModelUrl').orNull
            ?: System.getenv('MIDAS_MODEL_URL')
            ?: defaultMidasUrl

        if (!isValidTflite(generatedMidasModel)) {
            File temporaryModel = new File(generatedMidasAssetsDir, "${midasFileName}.part")
            temporaryModel.delete()
            logger.lifecycle("Downloading MiDaS model from ${configuredUrl}")
            def connection = new URL(configuredUrl).openConnection()
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000
            connection.setRequestProperty('User-Agent', 'Parallax-Moment-Android-Build')
            connection.inputStream.withCloseable { input ->
                temporaryModel.withOutputStream { output -> input.transferTo(output) }
            }
            if (!temporaryModel.renameTo(generatedMidasModel)) {
                temporaryModel.withInputStream { input ->
                    generatedMidasModel.withOutputStream { output -> input.transferTo(output) }
                }
                temporaryModel.delete()
            }
        }

        if (!isValidTflite(generatedMidasModel)) {
            throw new GradleException("MiDaS model is missing, too small, or not a valid TFLite file: ${generatedMidasModel}")
        }
    }
}

tasks.register('verifyMidasModel') {
    description = 'Verifies the MiDaS SHA-256 checksum before Android compilation.'
    group = 'verification'
    dependsOn('prepareMidasModel')
    inputs.file(generatedMidasModel)
    outputs.file(generatedMidasChecksum)

    doLast {
        String actual = sha256Of(generatedMidasModel)
        String expected = providers.gradleProperty('midasModelSha256').orNull
            ?: System.getenv('MIDAS_MODEL_SHA256')
        if (expected != null && !expected.trim().equalsIgnoreCase(actual)) {
            throw new GradleException("MiDaS checksum mismatch. Expected ${expected.trim()}, got ${actual}.")
        }
        generatedMidasChecksum.text = "${actual}  ${midasFileName}${System.lineSeparator()}"
        logger.lifecycle("MiDaS checksum verified: ${actual}")
    }
}

android {
    namespace 'com.depth.live.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.depth.live.wallpaper'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            // Only the generated, verified model is packaged. A stale LFS pointer cannot enter the APK.
            assets.srcDirs = ['../../www', generatedMidasAssetsDir]
        }
    }

    androidResources {
        noCompress += ['tflite']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named('preBuild').configure { dependsOn('verifyMidasModel') }

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
