plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

final String midasFileName = 'midas_small_256_fp16.tflite'
final long expectedMidasSize = 66_338_288L
final String expectedMidasSha256 = '93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd'
def localMidasModel = file("$projectDir/src/main/assets/$midasFileName")

def sha256Of = { File model ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    model.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

def hasTfliteHeader = { File model ->
    if (!model.isFile() || model.length() < 8) return false
    model.withInputStream { input ->
        byte[] header = new byte[8]
        return input.read(header) == header.length && new String(header, 4, 4, 'US-ASCII') == 'TFL3'
    }
}

tasks.register('verifyMidasModel') {
    description = 'Verifies the pinned MiDaS model before Android compilation.'
    group = 'verification'
    inputs.file(localMidasModel)

    doLast {
        if (!localMidasModel.isFile()) throw new GradleException("Missing ${midasFileName} at ${localMidasModel}")
        if (localMidasModel.length() != expectedMidasSize) throw new GradleException("MiDaS size mismatch. Expected ${expectedMidasSize} bytes, got ${localMidasModel.length()}.")
        if (!hasTfliteHeader(localMidasModel)) throw new GradleException('MiDaS model is not a valid TFLite file: TFL3 header missing.')
        String actual = sha256Of(localMidasModel)
        if (!expectedMidasSha256.equalsIgnoreCase(actual)) throw new GradleException("MiDaS checksum mismatch. Expected ${expectedMidasSha256}, got ${actual}.")
        logger.lifecycle("MiDaS model verified: ${actual}")
    }
}

android {
    namespace 'com.depth.live.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.depth.live.wallpaper'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets { main { assets.srcDirs = ['../../www', 'src/main/assets'] } }
    androidResources { noCompress += ['tflite'] }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

tasks.named('preBuild').configure { dependsOn('verifyMidasModel') }

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
