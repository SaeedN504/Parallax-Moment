plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.security.MessageDigest

final String midasFileName = 'midas_small_256_fp16.tflite'
final String defaultMidasUrl = 'https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite'
def generatedMidasAssetsDir = file("$buildDir/generated/midasAssets")
def generatedMidasModel = new File(generatedMidasAssetsDir, midasFileName)

tasks.register('prepareMidasModel') {
    description = 'Downloads and validates the official MiDaS v2.1 TFLite model at build time.'
    group = 'build setup'
    outputs.file(generatedMidasModel)

    doLast {
        generatedMidasAssetsDir.mkdirs()
        String configuredUrl = providers.gradleProperty('midasModelUrl').orNull
            ?: System.getenv('MIDAS_MODEL_URL')
            ?: defaultMidasUrl

        boolean validExistingModel = generatedMidasModel.isFile() && generatedMidasModel.length() > 60_000_000L
        if (!validExistingModel) {
            File temporaryModel = new File(generatedMidasAssetsDir, "${midasFileName}.part")
            temporaryModel.delete()
            logger.lifecycle("Downloading MiDaS model from ${configuredUrl}")
            def connection = new URL(configuredUrl).openConnection()
            connection.connectTimeout = 30_000
            connection.readTimeout = 120_000
            connection.setRequestProperty('User-Agent', 'Parallax-Moment-Android-Build')
            connection.inputStream.withCloseable { input ->
                temporaryModel.withOutputStream { output -> input.transferTo(output) }
            }
            if (!temporaryModel.renameTo(generatedMidasModel)) {
                temporaryModel.withInputStream { input ->
                    generatedMidasModel.withOutputStream { output -> input.transferTo(output) }
                }
                temporaryModel.delete()
            }
        }

        if (generatedMidasModel.length() <= 60_000_000L) {
            throw new GradleException("MiDaS download is too small (${generatedMidasModel.length()} bytes); refusing to package a pointer or error page.")
        }
        generatedMidasModel.withInputStream { input ->
            byte[] header = new byte[8]
            if (input.read(header) != header.length || new String(header, 4, 4, 'US-ASCII') != 'TFL3') {
                throw new GradleException('Downloaded MiDaS file is not a valid TensorFlow Lite flatbuffer.')
            }
        }

        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        generatedMidasModel.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        logger.lifecycle("MiDaS SHA-256: ${digest.digest().encodeHex()}")
    }
}

android {
    namespace 'com.depth.live.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.depth.live.wallpaper'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            // The model is generated here so the stale Git LFS pointer can never enter an APK.
            assets.srcDirs = ['../../www', generatedMidasAssetsDir]
        }
    }

    androidResources {
        noCompress += ['tflite']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named('preBuild').configure { dependsOn('prepareMidasModel') }

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
