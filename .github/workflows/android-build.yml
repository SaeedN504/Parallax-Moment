name: Android Build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "clockveil/**"
      - "www/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "clockveil/**"
      - "www/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build and test debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The Gradle daemon JVM criteria in android/gradle and clockveil/gradle pin
      # toolchain 21, so the runner must expose a JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found on the runner"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
              break
            fi
            echo "sdkmanager attempt $attempt failed, retrying in 15s"
            sleep 15
            if [[ "$attempt" == "3" ]]; then
              echo "::error::Android SDK installation failed after 3 attempts"
              exit 1
            fi
          done

      - name: Verify MiDaS model
        shell: bash
        run: |
          set -euo pipefail

          MODEL="android/app/src/main/assets/midas_small_256_fp16.tflite"
          EXPECTED_SIZE="66338288"
          EXPECTED_SHA="93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd"

          if [[ ! -f "$MODEL" ]]; then
            echo "::error::Missing MiDaS model: $MODEL"
            exit 1
          fi

          actual_size="$(stat --format=%s "$MODEL")"
          actual_sha="$(sha256sum "$MODEL" | cut -d ' ' -f 1)"
          header="$(dd if="$MODEL" bs=1 skip=4 count=4 2>/dev/null)"

          echo "Model size: $actual_size bytes"
          echo "Model SHA-256: $actual_sha"
          echo "Model header: $header"

          [[ "$actual_size" == "$EXPECTED_SIZE" ]] || {
            echo "::error::MiDaS size mismatch: expected $EXPECTED_SIZE, got $actual_size"
            exit 1
          }

          [[ "$actual_sha" == "$EXPECTED_SHA" ]] || {
            echo "::error::MiDaS checksum mismatch"
            exit 1
          }

          [[ "$header" == "TFL3" ]] || {
            echo "::error::MiDaS file is not a valid TFLite file"
            exit 1
          }

      - name: Make Gradle wrappers executable
        run: |
          chmod +x android/gradlew clockveil/gradlew

      - name: Run unit tests and lint (Parallax Moment)
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace --no-daemon

      - name: Build Parallax Moment debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Deep FX Clock debug APK
        working-directory: clockveil
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum clockveil/app/build/outputs/apk/debug/app-debug.apk | tee clockveil/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: parallax-moment-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            clockveil/app/build/outputs/apk/debug/app-debug.apk
            clockveil/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
