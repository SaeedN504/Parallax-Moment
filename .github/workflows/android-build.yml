name: Android Build
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "clockveil/**"
      - "www/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "clockveil/**"
      - "www/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build and test debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # The Gradle daemon JVM criteria in android/gradle and clockveil/gradle pin
      # toolchain 21, so the runner must expose a JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
              break
            fi
            echo "sdkmanager attempt $attempt failed, retrying in 15s"
            sleep 15
            if [[ "$attempt" == "3" ]]; then
              echo "::error::Android SDK installation failed after 3 attempts"
              exit 1
            fi
          done

      - name: Verify MiDaS model (Relaxed Mode)
        shell: bash
        run: |
          set -euo pipefail
          MODEL="android/app/src/main/assets/midas_small_256_fp16.tflite"
          
          if [[ ! -f "$MODEL" ]]; then
            echo "::error::Missing MiDaS model: $MODEL"
            exit 1
          fi
          
          actual_size="$(stat --format=%s "$MODEL")"
          header="$(dd if="$MODEL" bs=1 skip=4 count=4 2>/dev/null)"
          
          echo "Model size: $actual_size bytes"
          echo "Model header: $header"
          
          # RELAXED CHECK: Accept any valid TFLite model > 50MB 
          # This allows the official 119MB model_opt.tflite or the smaller 66MB variant.
          (( actual_size > 50000000 )) || {
            echo "::error::MiDaS model seems too small ($actual_size bytes). Is it corrupted?"
            exit 1
          }
          
          [[ "$header" == "TFL3" ]] || {
            echo "::error::MiDaS file is not a valid TFLite file (missing TFL3 header)"
            exit 1
          }
          
          echo "✅ Model validation passed (flexible mode)."

      - name: Make Gradle wrappers executable
        run: |
          chmod +x android/gradlew clockveil/gradlew

      - name: Run unit tests and lint (Parallax Moment)
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace --no-daemon

      - name: Build Parallax Moment debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Deep FX Clock debug APK
        working-directory: clockveil
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum clockveil/app/build/outputs/apk/debug/app-debug.apk | tee clockveil/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: parallax-moment-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            clockveil/app/build/outputs/apk/debug/app-debug.apk
            clockveil/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
