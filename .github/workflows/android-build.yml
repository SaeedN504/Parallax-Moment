name: Android Build

on:
  push:
    branches: [ "native-android", "fix/android-build-and-ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew executable
      run: chmod +x ./android/gradlew

    - name: Verify MiDaS model exists
      run: |
        if [ ! -f "android/app/src/main/assets/midas_small_256_fp16.tflite" ]; then
          echo "Error: MiDaS model file not found!"
          exit 1
        fi
        echo "MiDaS model found!"

    - name: Verify MiDaS model size and checksum
      run: |
        MODEL="android/app/src/main/assets/midas_small_256_fp16.tflite"
        ACTUAL_SIZE=$(stat -c%s "$MODEL")
        EXPECTED_SIZE=66338288
        
        echo "Model size: $ACTUAL_SIZE bytes"
        echo "Model SHA-256: $(sha256sum "$MODEL" | cut -d' ' -f1)"
        
        if [ "$ACTUAL_SIZE" -ne "$EXPECTED_SIZE" ]; then
          echo "Error: MiDaS size mismatch. Expected $EXPECTED_SIZE bytes, got $ACTUAL_SIZE bytes."
          exit 1
        fi
        echo "MiDaS model verified successfully!"

    - name: Build debug APK
      working-directory: ./android
      run: ./gradlew clean assembleDebug --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7