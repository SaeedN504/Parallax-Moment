name: Android Build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "www/**"
      - ".github/workflows/android-build.yml"

  push:
    branches: [main]
    paths:
      - "android/**"
      - "www/**"
      - ".github/workflows/android-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS assets
        working-directory: .
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify MiDaS model exists
        shell: bash
        run: |
          MODEL="app/src/main/assets/midas_small_256_fp16.tflite"

          if [ ! -f "$MODEL" ]; then
            echo "::error::Missing MiDaS model: android/$MODEL"
            echo "Add the verified model through Git LFS before building."
            exit 1
          fi

      - name: Verify MiDaS model size and checksum
        shell: bash
        run: |
          MODEL="app/src/main/assets/midas_small_256_fp16.tflite"
          EXPECTED_SIZE="33554432"
          EXPECTED_SHA="bec9bce704789e504ec306196fcb0aabe90fd25c2b9d7db382339741950890ca"

          ACTUAL_SIZE="$(stat --format=%s "$MODEL")"
          ACTUAL_SHA="$(sha256sum "$MODEL" | cut -d ' ' -f 1)"

          echo "Model size: $ACTUAL_SIZE bytes"
          echo "Model SHA-256: $ACTUAL_SHA"

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::MiDaS size mismatch. Expected $EXPECTED_SIZE bytes."
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::MiDaS checksum mismatch."
            exit 1
          fi

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Generate APK checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: parallax-moment-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
