name: Android Build

on:
  push:
    branches: [ main, master, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Make Gradlew executable
      run: chmod +x ./gradlew
    
    - name: Verify MiDaS model exists
      run: |
        if [ ! -f "app/src/main/assets/midas_small_256_fp16.tflite" ]; then
          echo "Error: MiDaS model file not found!"
          exit 1
        fi
        echo "Model file exists"
    
    - name: Verify MiDaS model size and checksum
      run: |
        MODEL="app/src/main/assets/midas_small_256_fp16.tflite"
        ACTUAL_SIZE=$(stat -c%s "$MODEL")
        ACTUAL_HASH=$(sha256sum "$MODEL" | awk '{print $1}')
        
        echo "Model size: $ACTUAL_SIZE bytes"
        echo "Model SHA-256: $ACTUAL_HASH"
        
        EXPECTED_SIZE=66338288
        EXPECTED_HASH="93d871071edff1218973ce25ee27ce95ccd20450c70a55e1b89efa3f5a772cdd"
        
        if [ "$ACTUAL_SIZE" -ne "$EXPECTED_SIZE" ]; then
          echo "Error: MiDaS size mismatch. Expected $EXPECTED_SIZE bytes."
          exit 1
        fi
        
        if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
          echo "Error: MiDaS checksum mismatch. Expected $EXPECTED_HASH"
          exit 1
        fi
        
        echo "MiDaS model verified successfully"
    
    - name: Build debug APK
      run: ./gradlew clean assembleDebug --stacktrace
    
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk